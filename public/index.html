<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinuca Online</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎱%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1b;--card:#fff;--muted:#6b6a65;--green:#2e9e5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191a;--fg:#ecebe6;--card:#232627;--muted:#9a9a93}}
:root[data-theme="dark"]{--bg:#17191a;--fg:#ecebe6;--card:#232627;--muted:#9a9a93}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;min-height:100vh}
h1{margin:8px 0 0;font-size:28px}
.sub{color:var(--muted);margin:0;text-align:center;font-size:14px}
.card{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
input{padding:12px;border-radius:10px;border:1px solid var(--muted);background:var(--bg);color:var(--fg);font-size:16px;width:100%}
button{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--muted)}
.row{display:flex;gap:8px}
#status{min-height:20px;text-align:center;font-size:14px}
#game{display:none;width:100%;max-width:820px;flex-direction:column;align-items:center;gap:10px}
.bar{width:100%;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pl{background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;flex:1;min-width:130px;border:2px solid transparent}
.pl.on{border-color:var(--green)}
.pl small{color:var(--muted);display:block}
canvas{width:100%;height:auto;touch-action:none;border-radius:14px;display:block}
#msg{font-size:15px;min-height:22px;text-align:center}
.help{color:var(--muted);font-size:13px;margin:0;text-align:center;max-width:620px}
</style>
</head>
<body>
<div id="lobby" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%">
  <h1>🎱 Sinuca Online</h1>
  <p class="sub">Bola 8, 1 contra 1, de graça. Sem cadastro.</p>
  <div class="card">
    <input id="name" placeholder="Seu apelido" maxlength="16" autocomplete="off">
    <button id="bQueue">Jogar agora (achar adversário)</button>
    <button id="bPractice" class="alt">Treinar sozinho</button>
    <hr style="width:100%;border:0;border-top:1px solid var(--muted);opacity:.3">
    <button id="bCreate" class="alt">Criar sala para um amigo</button>
    <div class="row"><input id="code" placeholder="Código da sala" maxlength="6" autocomplete="off"><button id="bJoin" style="white-space:nowrap">Entrar</button></div>
    <div id="status"></div>
  </div>
</div>

<div id="game">
  <div class="bar">
    <div class="pl on" id="p0"><b id="n0">Jogador 1</b><small id="g0">mesa aberta</small></div>
    <div class="pl" id="p1"><b id="n1">Jogador 2</b><small id="g1">mesa aberta</small></div>
  </div>
  <canvas id="c" width="800" height="400"></canvas>
  <div id="msg"></div>
  <div class="row">
    <button id="bAgain" style="display:none">Jogar de novo</button>
    <button id="bLeave" class="alt">Sair da partida</button>
  </div>
  <p class="help">Na sua vez, arraste para trás a partir de qualquer ponto da mesa (como um estilingue) e solte para tacar. Quanto mais longe, mais forte. Lisas são 1–7, listradas 9–15.</p>
</div>

<script>
const W = 800, H = 400, R = 10, M = 30;
const COL = ['#fff', '#f2c200', '#1e5bd8', '#d62828', '#6a2c91', '#f27d0c', '#1f8a3d', '#8b1e1e', '#111'];
const PK = [[24, 24], [400, 20], [776, 24], [24, 376], [400, 380], [776, 376]], PR = 21;
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let ws = null, seat = 0, solo = false, S = null, drag = null;

// ---------- conexao ----------
function connect(then) {
  if (ws && ws.readyState === 1) { then(); return; }
  if (ws && ws.readyState === 0) { ws.addEventListener('open', then, { once: true }); return; }
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host);
  ws.onopen = () => { $('status').textContent = ''; then(); };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } onMsg(m); };
  ws.onclose = () => {
    showLobby();
    $('status').textContent = 'Conexão perdida. Recarregue a página para jogar de novo.';
  };
}
function send(o) { connect(() => ws.send(JSON.stringify(o))); }
function nm() { return $('name').value.trim() || 'Jogador'; }

function onMsg(m) {
  if (m.t === 'wait') { $('status').textContent = m.m; }
  else if (m.t === 'error') { $('status').textContent = m.m; }
  else if (m.t === 'match') { seat = m.seat; solo = !!m.solo; S = null; showGame(); }
  else if (m.t === 'state') {
    S = m;
    if (m.m) $('msg').textContent = m.m;
    updateUI();
  }
  else if (m.t === 'info') { $('msg').textContent = m.m; }
  else if (m.t === 'lobby') { showLobby(); }
}
function showLobby() { $('game').style.display = 'none'; $('lobby').style.display = 'flex'; }
function showGame() { $('lobby').style.display = 'none'; $('game').style.display = 'flex'; $('status').textContent = ''; $('bAgain').style.display = 'none'; }

const gname = g => g === 'solid' ? 'lisas (1–7)' : g === 'stripe' ? 'listradas (9–15)' : 'mesa aberta';
function updateUI() {
  if (!S) return;
  $('n0').textContent = S.names[0] + (!solo && seat === 0 ? ' (você)' : '');
  $('n1').textContent = S.names[1] + (!solo && seat === 1 ? ' (você)' : '');
  $('g0').textContent = gname(S.grp[0]); $('g1').textContent = gname(S.grp[1]);
  $('p0').className = 'pl' + (S.turn === 0 ? ' on' : ''); $('p1').className = 'pl' + (S.turn === 1 ? ' on' : '');
  $('bAgain').style.display = S.over ? '' : 'none';
}

// ---------- botoes ----------
$('bQueue').onclick = () => send({ t: 'queue', name: nm() });
$('bPractice').onclick = () => send({ t: 'practice', name: nm() });
$('bCreate').onclick = () => send({ t: 'create', name: nm() });
$('bJoin').onclick = () => { const c = $('code').value.trim(); if (c) send({ t: 'join', name: nm(), code: c }); };
$('bAgain').onclick = () => send({ t: 'again' });
$('bLeave').onclick = () => send({ t: 'leave' });
$('name').value = (() => { try { return localStorage.getItem('sinuca-name') || ''; } catch (e) { return ''; } })();
$('name').addEventListener('input', () => { try { localStorage.setItem('sinuca-name', $('name').value); } catch (e) {} });

// ---------- mira ----------
const canShoot = () => S && !S.moving && !S.over && (solo || S.turn === seat);
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
cv.addEventListener('pointerdown', e => { if (!canShoot()) return; cv.setPointerCapture(e.pointerId); drag = pos(e); });
cv.addEventListener('pointermove', e => { if (drag) drag = pos(e); });
cv.addEventListener('pointerup', () => {
  if (!drag || !S) { drag = null; return; }
  const c = S.b[0], dx = c[1] - drag[0], dy = c[2] - drag[1], d = Math.sqrt(dx * dx + dy * dy);
  drag = null;
  if (d < 8 || !canShoot()) return;
  const pw = Math.min(d, 160) / 160;
  send({ t: 'shot', vx: dx / d * pw * 9, vy: dy / d * pw * 9 });
});

// ---------- desenho ----------
function ball(b) {
  const n = b[0], x = b[1], y = b[2], str = n > 8;
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.clip();
  ctx.fillStyle = n === 0 || str ? '#fff' : COL[n]; ctx.fillRect(x - R, y - R, 2 * R, 2 * R);
  if (str) { ctx.fillStyle = COL[n - 8]; ctx.fillRect(x - R, y - 5, 2 * R, 10); }
  ctx.restore();
  if (n) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 4.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#111'; ctx.font = 'bold 7px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(n, x, y + .5);
  }
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.stroke();
}
// Linha de mira: vai até a primeira bola, quica na tabela (até 2 vezes) e mostra para onde a bola atingida vai
function guide(c, ux, uy) {
  const minX = M + R, maxX = W - M - R, minY = M + R, maxY = H - M - R;
  let x = c[1], y = c[2], dx = ux, dy = uy, left = 520, hit = null;
  const pts = [[x, y]];
  for (let k = 0; k < 3 && left > 0; k++) {
    let tBall = Infinity, hb = null;
    for (const b of S.b) {
      if (!b[3] || b[0] === 0) continue;
      const fx = b[1] - x, fy = b[2] - y, pr = fx * dx + fy * dy;
      if (pr <= 0) continue;
      const d2 = fx * fx + fy * fy - pr * pr;
      if (d2 >= 4 * R * R) continue;
      const t = Math.max(0, pr - Math.sqrt(4 * R * R - d2));
      if (t < tBall) { tBall = t; hb = b; }
    }
    let tWall = Infinity, vert = false;
    if (dx > 1e-6) { tWall = (maxX - x) / dx; vert = true; }
    else if (dx < -1e-6) { tWall = (minX - x) / dx; vert = true; }
    let ty = Infinity;
    if (dy > 1e-6) ty = (maxY - y) / dy; else if (dy < -1e-6) ty = (minY - y) / dy;
    if (ty < tWall) { tWall = ty; vert = false; }
    if (tBall <= tWall && tBall <= left) {
      hit = { x: x + dx * tBall, y: y + dy * tBall, b: hb };
      pts.push([hit.x, hit.y]);
      break;
    }
    const t = Math.max(0, Math.min(tWall, left));
    x += dx * t; y += dy * t; left -= t; pts.push([x, y]);
    if (t === tWall) { if (vert) dx = -dx; else dy = -dy; } else break;
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.setLineDash([7, 6]); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  if (hit) {
    // linha da bola atingida: curtinha, mas vai ate a cacapa quando ela esta indo para uma
    const bx = hit.b[1], by = hit.b[2];
    let nx = bx - hit.x, ny = by - hit.y; const nl = Math.sqrt(nx * nx + ny * ny) || 1; nx /= nl; ny /= nl;
    let len = 60;
    for (const p of PK) {
      const px = p[0] - bx, py = p[1] - by, pr = px * nx + py * ny;
      if (pr > 0 && Math.abs(px * ny - py * nx) < PR - 4) len = Math.max(len, Math.min(pr, 220));
    }
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + nx * len, by + ny * len); ctx.stroke();
  }
  ctx.setLineDash([]);
}
function draw() {
  ctx.fillStyle = '#5b3a1e'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1b7a46'; ctx.fillRect(M - 6, M - 6, W - 2 * M + 12, H - 2 * M + 12);
  ctx.fillStyle = '#0b0b0b'; for (const p of PK) { ctx.beginPath(); ctx.arc(p[0], p[1], PR, 0, 7); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.moveTo(230, M); ctx.lineTo(230, H - M); ctx.stroke();
  if (S) for (const b of S.b) if (b[3]) ball(b);
  if (drag && canShoot()) {
    const c = S.b[0], dx = c[1] - drag[0], dy = c[2] - drag[1], d = Math.sqrt(dx * dx + dy * dy) || 1;
    const pw = Math.min(d, 160) / 160, ux = dx / d, uy = dy / d;
    guide(c, ux, uy);
    const off = R + 6 + pw * 60; ctx.strokeStyle = '#d9b27c'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(c[1] - ux * off, c[2] - uy * off); ctx.lineTo(c[1] - ux * (off + 170), c[2] - uy * (off + 170)); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('Força ' + Math.round(pw * 100) + '%', M, H - 8);
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
