<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinuca Online</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎱%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0d1511;--card:#17211b;--fg:#f1efe8;--muted:#98a39b;--green:#2e9e5b;--gold:#d9b25f}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(120% 90% at 50% 0%,#21432f 0%,var(--bg) 62%);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));min-height:100vh}
h1{margin:8px 0 0;font-size:30px}
.sub{color:var(--muted);margin:0;text-align:center;font-size:14px}
.card{background:var(--card);border:1px solid rgba(217,178,95,.25);border-radius:14px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
input{padding:12px;border-radius:10px;border:1px solid #3b4a41;background:#0f1713;color:var(--fg);font-size:16px;width:100%}
button{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.alt{background:transparent;color:var(--fg);border:1px solid #4b5b51}
.row{display:flex;gap:8px}
#status{min-height:20px;text-align:center;font-size:14px}
#game{display:none;width:100%;max-width:900px;flex-direction:column;align-items:center;gap:10px}
.bar{width:100%;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pl{background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;flex:1;min-width:130px;border:2px solid transparent}
.pl.on{border-color:var(--gold)}
.pl small{color:var(--muted);display:block}
canvas{width:100%;height:auto;touch-action:none;border-radius:16px;display:block;box-shadow:0 18px 44px rgba(0,0,0,.6)}
#msg{font-size:15px;min-height:22px;text-align:center}
.help{color:var(--muted);font-size:13px;margin:0;text-align:center;max-width:620px}
</style>
</head>
<body>
<div id="lobby" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%">
  <h1>🎱 Sinuca Online</h1>
  <p class="sub">Bola 8, 1 contra 1, de graça. Sem cadastro.</p>
  <div class="card">
    <input id="name" placeholder="Seu apelido" maxlength="16" autocomplete="off">
    <button id="bQueue">Jogar agora (achar adversário)</button>
    <button id="bPractice" class="alt">Treinar sozinho</button>
    <hr style="width:100%;border:0;border-top:1px solid var(--muted);opacity:.3">
    <button id="bCreate" class="alt">Criar sala para um amigo</button>
    <div class="row"><input id="code" placeholder="Código da sala" maxlength="6" autocomplete="off"><button id="bJoin" style="white-space:nowrap">Entrar</button></div>
    <div id="status"></div>
  </div>
</div>

<div id="game">
  <div class="bar">
    <div class="pl on" id="p0"><b id="n0">Jogador 1</b><small id="g0">mesa aberta</small></div>
    <div class="pl" id="p1"><b id="n1">Jogador 2</b><small id="g1">mesa aberta</small></div>
  </div>
  <canvas id="c" width="1600" height="888"></canvas>
  <div id="msg"></div>
  <div class="row">
    <button id="bAgain" style="display:none">Jogar de novo</button>
    <button id="bMute" class="alt" aria-label="Som">🔊</button>
    <button id="bLeave" class="alt">Sair da partida</button>
  </div>
  <p class="help">Na sua vez, arraste para trás a partir de qualquer ponto da mesa (como um estilingue) e solte para tacar. Quanto mais longe, mais forte. Lisas são 1–7, listradas 9–15.</p>
</div>

<script>
const W = 800, H = 400, HT = 444, R = 10, M = 30, SC = 2, PR = 21;
const PK = [[24, 24], [400, 20], [776, 24], [24, 376], [400, 380], [776, 376]];
const RGB = [[250, 248, 240], [242, 194, 0], [30, 91, 216], [214, 40, 40], [106, 44, 145], [242, 125, 12], [31, 138, 61], [139, 30, 30], [20, 20, 20]];
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const rnd = (a, b) => a + Math.random() * (b - a);
let ws = null, seat = 0, solo = false, S = null, D = null, potted = [], drag = null, lastShot = null, pwCur = 0;

// ---------- som ----------
let AC = null, muted = false, lastS = 0;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
document.addEventListener('pointerdown', audio);
function clack(v, low) {
  if (!AC || muted) return;
  const t = AC.currentTime; if (t - lastS < .025) return; lastS = t;
  const vol = Math.min(.55, .08 + v * .6);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(low ? 150 : 1400 + Math.random() * 300, t);
  o.frequency.exponentialRampToValueAtTime(low ? 60 : 380, t + .06);
  g.gain.setValueAtTime(vol * .7, t); g.gain.exponentialRampToValueAtTime(.001, t + (low ? .2 : .07));
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .22);
  const nb = AC.createBuffer(1, 1400, AC.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const ns = AC.createBufferSource(), ng = AC.createGain(); ns.buffer = nb; ng.gain.value = vol * .6;
  ns.connect(ng); ng.connect(AC.destination); ns.start(t);
}
$('bMute').onclick = () => { muted = !muted; $('bMute').textContent = muted ? '🔇' : '🔊'; };

// ---------- conexao ----------
function connect(then) {
  if (ws && ws.readyState === 1) { then(); return; }
  if (ws && ws.readyState === 0) { ws.addEventListener('open', then, { once: true }); return; }
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host);
  ws.onopen = () => { $('status').textContent = ''; then(); };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } onMsg(m); };
  ws.onclose = () => {
    showLobby();
    $('status').textContent = 'Conexão perdida. Recarregue a página para jogar de novo.';
  };
}
function send(o) { connect(() => ws.send(JSON.stringify(o))); }
function nm() { return $('name').value.trim() || 'Jogador'; }

function onMsg(m) {
  if (m.t === 'wait') { $('status').textContent = m.m; }
  else if (m.t === 'error') { $('status').textContent = m.m; }
  else if (m.t === 'match') { seat = m.seat; solo = !!m.solo; S = null; D = null; potted = []; showGame(); }
  else if (m.t === 'state') {
    S = m; sync(m);
    if (m.m) $('msg').textContent = m.m;
    updateUI();
  }
  else if (m.t === 'info') { $('msg').textContent = m.m; }
  else if (m.t === 'lobby') { showLobby(); }
}
function showLobby() { $('game').style.display = 'none'; $('lobby').style.display = 'flex'; }
function showGame() { $('lobby').style.display = 'none'; $('game').style.display = 'flex'; $('status').textContent = ''; $('bAgain').style.display = 'none'; }

const gname = g => g === 'solid' ? 'lisas (1–7)' : g === 'stripe' ? 'listradas (9–15)' : 'mesa aberta';
function updateUI() {
  if (!S) return;
  $('n0').textContent = S.names[0] + (!solo && seat === 0 ? ' (você)' : '');
  $('n1').textContent = S.names[1] + (!solo && seat === 1 ? ' (você)' : '');
  $('g0').textContent = gname(S.grp[0]); $('g1').textContent = gname(S.grp[1]);
  $('p0').className = 'pl' + (S.turn === 0 ? ' on' : ''); $('p1').className = 'pl' + (S.turn === 1 ? ' on' : '');
  $('bAgain').style.display = S.over ? '' : 'none';
}

// ---------- botoes ----------
$('bQueue').onclick = () => send({ t: 'queue', name: nm() });
$('bPractice').onclick = () => send({ t: 'practice', name: nm() });
$('bCreate').onclick = () => send({ t: 'create', name: nm() });
$('bJoin').onclick = () => { const c = $('code').value.trim(); if (c) send({ t: 'join', name: nm(), code: c }); };
$('bAgain').onclick = () => send({ t: 'again' });
$('bLeave').onclick = () => send({ t: 'leave' });
$('name').value = (() => { try { return localStorage.getItem('sinuca-name') || ''; } catch (e) { return ''; } })();
$('name').addEventListener('input', () => { try { localStorage.setItem('sinuca-name', $('name').value); } catch (e) {} });

// ---------- mira ----------
const canShoot = () => S && D && !S.moving && !S.over && (solo || S.turn === seat);
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * HT / r.height]; }
cv.addEventListener('pointerdown', e => { if (!canShoot()) return; cv.setPointerCapture(e.pointerId); drag = pos(e); });
cv.addEventListener('pointermove', e => { if (drag) drag = pos(e); });
cv.addEventListener('pointerup', () => {
  if (!drag || !S) { drag = null; return; }
  const c = S.b[0], dx = c[1] - drag[0], dy = c[2] - drag[1], d = Math.sqrt(dx * dx + dy * dy);
  drag = null;
  if (d < 8 || !canShoot()) return;
  const pw = Math.min(d, 160) / 160;
  lastShot = { ux: dx / d, uy: dy / d, off: R + 5 + pw * 55, t: performance.now() };
  send({ t: 'shot', vx: dx / d * pw * 9, vy: dy / d * pw * 9 });
});

// ---------- mesa (desenhada uma vez) ----------
const TB = document.createElement('canvas'); TB.width = W * SC; TB.height = HT * SC;
(function () {
  const g = TB.getContext('2d'); g.scale(SC, SC);
  const tr = () => g.roundRect(0, 0, W, H, 16);
  g.fillStyle = '#0c0907'; g.fillRect(0, 0, W, HT);
  // madeira
  const w = g.createLinearGradient(0, 0, 0, H);
  w.addColorStop(0, '#8a5630'); w.addColorStop(.5, '#603719'); w.addColorStop(1, '#3f2410');
  g.fillStyle = w; g.beginPath(); tr(); g.fill();
  g.save(); g.beginPath(); tr(); g.clip();
  const gr = a => Math.random() < .5 ? `rgba(25,10,0,${rnd(.04, .1)})` : `rgba(255,205,150,${rnd(.03, .07)})`;
  for (let i = 0; i < 300; i++) {
    g.strokeStyle = gr(); g.lineWidth = rnd(.3, 1); const y = rnd(0, H);
    g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(250, y + rnd(-3, 3), 550, y + rnd(-3, 3), W, y + rnd(-2, 2)); g.stroke();
  }
  for (const sx of [0, W - 24]) {
    g.save(); g.beginPath(); g.rect(sx, 0, 24, H); g.clip(); g.fillStyle = w; g.fillRect(sx, 0, 24, H);
    for (let i = 0; i < 45; i++) { g.strokeStyle = gr(); g.lineWidth = rnd(.3, 1); const x = sx + rnd(0, 24); g.beginPath(); g.moveTo(x, 0); g.lineTo(x + rnd(-1, 1), H); g.stroke(); }
    g.restore();
  }
  g.strokeStyle = 'rgba(255,225,180,.35)'; g.lineWidth = 1.2; g.beginPath(); g.roundRect(1, 1, W - 2, H - 2, 15); g.stroke();
  g.restore();
  // borracha e feltro
  g.fillStyle = '#0b4a28'; g.fillRect(24, 24, W - 48, H - 48);
  g.strokeStyle = 'rgba(120,220,160,.35)'; g.lineWidth = 1; g.strokeRect(24.5, 24.5, W - 49, H - 49);
  const f = g.createRadialGradient(400, 185, 30, 400, 200, 470);
  f.addColorStop(0, '#3aae66'); f.addColorStop(.6, '#238a4f'); f.addColorStop(1, '#145f35');
  g.fillStyle = f; g.fillRect(M, M, W - 2 * M, H - 2 * M);
  for (let i = 0; i < 9000; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.05)'; g.fillRect(rnd(M, W - M), rnd(M, H - M), .8, .8); }
  for (const [x0, y0, x1, y1] of [[0, M, 0, M + 12], [0, H - M, 0, H - M - 12], [M, 0, M + 12, 0], [W - M, 0, W - M - 12, 0]]) {
    const s = g.createLinearGradient(x0, y0, x1, y1); s.addColorStop(0, 'rgba(0,0,0,.42)'); s.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = s; g.fillRect(M, M, W - 2 * M, H - 2 * M);
  }
  const lg = g.createRadialGradient(400, 170, 40, 400, 200, 430);
  lg.addColorStop(0, 'rgba(255,255,255,.11)'); lg.addColorStop(1, 'rgba(0,0,0,.3)');
  g.fillStyle = lg; g.fillRect(M, M, W - 2 * M, H - 2 * M);
  g.strokeStyle = 'rgba(255,255,255,.2)'; g.lineWidth = 1; g.beginPath(); g.moveTo(230, M); g.lineTo(230, H - M); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.35)'; for (const x of [230, 560]) { g.beginPath(); g.arc(x, 200, 2, 0, 7); g.fill(); }
  // cacapas
  g.save(); g.beginPath(); tr(); g.clip();
  for (const [px, py] of PK) {
    const l = g.createRadialGradient(px, py, PR - 2, px, py, PR + 9); l.addColorStop(0, '#2b1809'); l.addColorStop(1, '#5a3519');
    g.fillStyle = l; g.beginPath(); g.arc(px, py, PR + 9, 0, 7); g.fill();
    g.strokeStyle = '#c9a24a'; g.lineWidth = 2.2; g.beginPath(); g.arc(px, py, PR + 3.5, 0, 7); g.stroke();
    g.strokeStyle = 'rgba(255,240,180,.55)'; g.lineWidth = .7; g.beginPath(); g.arc(px, py, PR + 4.6, Math.PI * 1.1, Math.PI * 1.7); g.stroke();
    const h = g.createRadialGradient(px, py - 3, 2, px, py, PR); h.addColorStop(0, '#000'); h.addColorStop(1, '#1c1c1c');
    g.fillStyle = h; g.beginPath(); g.arc(px, py, PR, 0, 7); g.fill();
    g.save(); g.beginPath(); g.arc(px, py, PR - 1, 0, 7); g.clip(); g.strokeStyle = 'rgba(130,130,130,.18)'; g.lineWidth = .6;
    for (let k = -PR * 2; k < PR * 2; k += 4.5) { g.beginPath(); g.moveTo(px + k, py - PR); g.lineTo(px + k + PR, py + PR); g.moveTo(px + k, py + PR); g.lineTo(px + k + PR, py - PR); g.stroke(); }
    g.restore();
  }
  g.restore();
  // diamantes
  const dia = (x, y) => {
    g.fillStyle = '#f3ead2'; g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = .6;
    g.beginPath(); g.moveTo(x, y - 3.6); g.lineTo(x + 2.4, y); g.lineTo(x, y + 3.6); g.lineTo(x - 2.4, y); g.closePath(); g.fill(); g.stroke();
  };
  for (const k of [1, 2, 3]) for (const x of [50 + 325 * k / 4, 425 + 325 * k / 4]) { dia(x, 12); dia(x, H - 12); }
  for (const y of [125, 200, 275]) { dia(12, y); dia(W - 12, y); }
  // faixa de baixo: forca e bolas encacapadas
  const st = g.createLinearGradient(0, H, 0, HT); st.addColorStop(0, '#2b1b0f'); st.addColorStop(1, '#120c07');
  g.fillStyle = st; g.fillRect(0, H, W, HT - H);
  g.strokeStyle = '#080604'; g.fillStyle = '#080604'; g.lineWidth = 1.5;
  g.strokeStyle = '#b8913f'; g.beginPath(); g.roundRect(326, H + 7, 456, 30, 15); g.fillStyle = '#080604'; g.fill(); g.stroke();
  g.beginPath(); g.roundRect(68, H + 13, 244, 18, 9); g.fill(); g.stroke();
  g.fillStyle = '#e8d7a8'; g.font = '600 11px system-ui,sans-serif'; g.textBaseline = 'middle'; g.fillText('FORÇA', 22, H + 22.5);
})();

// ---------- bolas (sombreadas pixel a pixel, com giro 3D) ----------
const BS = 44, bc = document.createElement('canvas'); bc.width = bc.height = BS;
const bx = bc.getContext('2d'), img = bx.createImageData(BS, BS), ID = [1, 0, 0, 0, 1, 0, 0, 0, 1];
const LX = -.35, LY = -.55, LZ = .76, HX = -.185, HY = -.291, HZ = .931;
function shade(n, m) {
  const d = img.data, r = SC * R, c = BS / 2;
  for (let py = 0; py < BS; py++) for (let px = 0; px < BS; px++) {
    const u = (px + .5 - c) / r, v = (py + .5 - c) / r, q2 = u * u + v * v, k = (py * BS + px) * 4, rr = Math.sqrt(q2);
    if (rr > 1.04) { d[k + 3] = 0; continue; }
    const w = Math.sqrt(Math.max(0, 1 - q2));
    const qy = m[1] * u + m[4] * v + m[7] * w, qz = m[2] * u + m[5] * v + m[8] * w, az = Math.abs(qz);
    let col = RGB[0];
    if (n === 0) { if (qz > .965) col = [200, 30, 30]; }
    else if (az > .9) col = RGB[0];
    else if (n < 8) col = RGB[n];
    else if (n === 8) col = RGB[8];
    else if (Math.abs(qy) < .52) col = RGB[n - 8];
    const df = Math.max(0, u * LX + v * LY + w * LZ);
    let sp = Math.max(0, u * HX + v * HY + w * HZ); sp *= sp; sp *= sp; sp *= sp; sp *= sp; sp *= sp;
    const sh = (.3 + .78 * df) * (.78 + .22 * w);
    d[k] = Math.min(255, col[0] * sh + sp * 255 * .85);
    d[k + 1] = Math.min(255, col[1] * sh + sp * 255 * .85);
    d[k + 2] = Math.min(255, col[2] * sh + sp * 255 * .85);
    d[k + 3] = rr < 1 ? 255 : 255 * (1.04 - rr) / .04;
  }
  bx.putImageData(img, 0, 0);
}
function drawBallAt(n, m, x, y, s, sh) {
  const r = R * s;
  if (sh) {
    const g = ctx.createRadialGradient(x + 2 * s, y + 3.2 * s, r * .2, x + 2 * s, y + 3.2 * s, r * 1.25);
    g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x + 2 * s, y + 3.2 * s, r * 1.25, 0, 7); ctx.fill();
  }
  shade(n, m);
  const k = BS / SC; ctx.drawImage(bc, x - k / 2 * s, y - k / 2 * s, k * s, k * s);
  if (n && s > .99) {
    for (const sg of [1, -1]) {
      const wx = sg * m[2], wy = sg * m[5], wz = sg * m[8]; if (wz < .25) continue;
      const a = Math.atan2(wy, wx), th = Math.atan2(m[4], m[1]) - Math.PI / 2;
      ctx.save(); ctx.translate(x + wx * R * .98, y + wy * R * .98); ctx.rotate(a); ctx.scale(wz, 1); ctx.rotate(th - a);
      ctx.fillStyle = '#111'; ctx.font = 'bold 5.4px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(n, 0, .3); ctx.restore();
    }
  }
}
const mul = (a, b) => { const r = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) r.push(a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j]); return r; };
function spin(d, dx, dy) {
  const dist = Math.hypot(dx, dy); if (dist < 1e-3) return;
  const ang = dist / R, ax = -dy / dist, ay = dx / dist, c = Math.cos(ang), s = Math.sin(ang), t = 1 - c;
  d.M = mul([c + t * ax * ax, t * ax * ay, s * ay, t * ax * ay, c + t * ay * ay, -s * ax, -s * ay, s * ax, c], d.M);
}
function rot0() {
  const a = rnd(0, 6.28), c = Math.cos(a), s = Math.sin(a), o = { M: [c, -s, 0, s, c, 0, 0, 0, 1] };
  spin(o, rnd(-6, 6), rnd(-6, 6)); return o.M;
}

// ---------- estado das bolas na tela ----------
function sync(m) {
  if (!D) { D = m.b.map(b => ({ x: b[1], y: b[2], tx: b[1], ty: b[2], lx: b[1], ly: b[2], lvx: 0, lvy: 0, lsp: 0, act: b[3], s: b[3] ? 1 : 0, n: b[0], px: 0, py: 0, M: rot0() })); return; }
  m.b.forEach((b, i) => {
    const d = D[i], vx = b[1] - d.lx, vy = b[2] - d.ly, sp = Math.hypot(vx, vy);
    if (b[3] && d.act) {
      if (sp - d.lsp > 1.3) clack((sp - d.lsp) / 9);
      else if (sp > 1 && (vx * d.lvx < -.5 || vy * d.lvy < -.5)) clack(sp / 14);
    }
    d.lx = b[1]; d.ly = b[2]; d.lvx = vx; d.lvy = vy; d.lsp = sp; d.tx = b[1]; d.ty = b[2];
    if (b[3] && !d.act) { d.act = 1; d.s = 1; d.x = d.tx; d.y = d.ty; d.M = rot0(); }
    else if (!b[3] && d.act) {
      d.act = 0; clack(.5, 1);
      let bp = PK[0]; for (const p of PK) if (Math.hypot(p[0] - d.x, p[1] - d.y) < Math.hypot(bp[0] - d.x, bp[1] - d.y)) bp = p;
      d.px = bp[0]; d.py = bp[1]; if (i) potted.push(i);
    }
  });
  if (D.every(d => d.act)) potted = [];
}

// ---------- taco e mira ----------
function cue(cx, cy, ux, uy, off) {
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - ux * off + 2, cy - uy * off + 4); ctx.lineTo(cx - ux * (off + 190) + 2, cy - uy * (off + 190) + 4); ctx.stroke();
  ctx.translate(cx, cy); ctx.rotate(Math.atan2(-uy, -ux));
  const trap = (x0, x1, w0, w1, st) => {
    const g = ctx.createLinearGradient(0, -2.6, 0, 2.6); st.forEach((c, i) => g.addColorStop(i / (st.length - 1), c));
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(off + x0, -w0 / 2); ctx.lineTo(off + x1, -w1 / 2); ctx.lineTo(off + x1, w1 / 2); ctx.lineTo(off + x0, w0 / 2); ctx.closePath(); ctx.fill();
  };
  trap(8, 120, 2.2, 3.4, ['#8a5a2b', '#f0d6a0', '#d3a867', '#7a4c22']);
  trap(120, 190, 3.4, 4.8, ['#1c0e05', '#6b3d1e', '#4a2a14', '#120a03']);
  ctx.fillStyle = '#c9a24a'; ctx.fillRect(off + 118, -2.1, 3, 4.2);
  ctx.fillStyle = '#f4f1e8'; ctx.fillRect(off + 3, -1.1, 5, 2.2);
  ctx.fillStyle = '#3b6bd1'; ctx.fillRect(off, -1, 3, 2);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = .5; ctx.beginPath(); ctx.moveTo(off + 9, -.7); ctx.lineTo(off + 118, -1.2); ctx.stroke();
  ctx.restore();
}
function ray(c, ux, uy) {
  let t = 1e9, hit = -1; const lo = M + R, hx = W - M - R, hy = H - M - R;
  if (ux > 0) t = Math.min(t, (hx - c.x) / ux); else if (ux < 0) t = Math.min(t, (lo - c.x) / ux);
  if (uy > 0) t = Math.min(t, (hy - c.y) / uy); else if (uy < 0) t = Math.min(t, (lo - c.y) / uy);
  D.forEach((b, i) => {
    if (!i || !b.act) return;
    const fx = c.x - b.x, fy = c.y - b.y, B = fx * ux + fy * uy, C = fx * fx + fy * fy - 4 * R * R, ds = B * B - C;
    if (ds < 0) return; const tt = -B - Math.sqrt(ds); if (tt > 0 && tt < t) { t = tt; hit = i; }
  });
  return { t, hit };
}

// ---------- desenho ----------
function frame() {
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  ctx.drawImage(TB, 0, 0, W, HT);
  if (S && D) {
    for (const d of D) {
      if (d.act) {
        const ox = d.x, oy = d.y;
        if (Math.hypot(d.tx - d.x, d.ty - d.y) > 60) { d.x = d.tx; d.y = d.ty; } else { d.x += (d.tx - d.x) * .6; d.y += (d.ty - d.y) * .6; }
        spin(d, d.x - ox, d.y - oy);
      } else if (d.s > 0) { d.s = Math.max(0, d.s - .07); d.x += (d.px - d.x) * .3; d.y += (d.py - d.y) * .3; }
      if (d.s > 0) drawBallAt(d.n, d.M, d.x, d.y, d.s, 1);
    }
    potted.forEach((i, j) => drawBallAt(D[i].n, ID, 349 + j * 28, H + 22, 1, 0));
    const c = D[0];
    pwCur = 0;
    if (drag && canShoot() && c.act) {
      const dx = c.x - drag[0], dy = c.y - drag[1], d = Math.hypot(dx, dy) || 1, pw = Math.min(d, 160) / 160, ux = dx / d, uy = dy / d;
      pwCur = pw;
      const r = ray(c, ux, uy), gx = c.x + ux * r.t, gy = c.y + uy * r.t;
      ctx.lineWidth = 1.4; ctx.lineCap = 'butt'; ctx.strokeStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.moveTo(c.x + ux * R, c.y + uy * R); ctx.lineTo(gx, gy); ctx.stroke();
      ctx.beginPath(); ctx.arc(gx, gy, R, 0, 7); ctx.stroke();
      if (r.hit >= 0) {
        const b = D[r.hit]; let nx = b.x - gx, ny = b.y - gy; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
        ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + nx * 70, b.y + ny * 70); ctx.stroke();
        const dt = ux * nx + uy * ny; let tx = ux - dt * nx, ty = uy - dt * ny; const tl = Math.hypot(tx, ty);
        if (tl > .05) { tx /= tl; ty /= tl; ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + tx * 38 * tl, gy + ty * 38 * tl); ctx.stroke(); }
      }
      cue(c.x, c.y, ux, uy, R + 5 + pw * 55);
    } else if (lastShot) {
      const e = (performance.now() - lastShot.t) / 130;
      if (e < 1) cue(c.x, c.y, lastShot.ux, lastShot.uy, lastShot.off + (R + 1 - lastShot.off) * e); else lastShot = null;
    }
  }
  // barra de forca
  if (pwCur > 0) {
    const g = ctx.createLinearGradient(70, 0, 310, 0); g.addColorStop(0, '#3ecf74'); g.addColorStop(.6, '#e8c93a'); g.addColorStop(1, '#e0483a');
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(70, H + 15, 240 * pwCur, 14, 7); ctx.fill();
  }
  requestAnimationFrame(frame);
}
frame();
</script>
